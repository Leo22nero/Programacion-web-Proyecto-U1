<main class="contenedor sombra">
    <section>
        <h2>Contactanos</h2>
        <form class="formulario" id="formulario-contacto">
            <fieldset>
                <div class="contenedor-info">
                        <div class="info">
                            <label>nombre:</label>
                            <input class="input-text" type="text" id=nombre>
                        </div>
                        <div class="info">
                            <label>telefono:</label>
                            <input class="input-text" type="tel" id="telefono">
                        </div>
                        <div class="info">
                            <label>email:</label>
                            <input class="input-text" type="email" id="email">
                        </div>
                        <div class="info">
                            <label>mensaje:</label>
                            <textarea class="input-text" id="mensaje"></textarea>
                        </div>
                    </div> 
                    <div class="alinear-derecha flex">
                        <input class="boton w-sm-100" type="submit" value="Enviar">
                    </div>      
            </fieldset>
        </form>
    </section>
