<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>

    <link rel="preload" href="css/normalize.css" as="style">
    <link rel="stylesheet" href="css/normalize.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preload" href="css/contacto.css" as="style">
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>
<main class="contacto">
    <section class="contacto-izquierda">
     
        <a href="index.html" class="logo-immersive">
            <img src="./img/contacto/logo-immersive-azul.webp"
                 alt="Immersive Lens">
        </a>
       
        <a href="index.html" class="icono-casa">
            <img src="./img/contacto/casa-azul.webp" alt="Inicio">
        </a>

        <div class="oliver-azul">
            <img src="./img/contacto/logo-oliver.webp"
                 alt="Oliver Martinez Fotógrafo">
        </div>
       
        <img src="./img/contacto/linea-intermedia.webp"
             alt=""
             class="linea-intermedia">

    </section>

    <!--Grid derecho-->
    <section class="contacto-derecha">

<section class="contacto-derecha">

    <div class="contenido-contacto">

        <h1>CONTACTANOS</h1>

        <form class="formulario-contacto">
          
            <div class="campo">
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Nombre"
                    required
                >
            </div>

            
            <div class="campo">
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Correo"
                    required
                >
            </div>

         
            <div class="campo">
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Número de teléfono"
                >
            </div>

          
            <div class="campo-mensaje">
                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Mensaje:"
                    required
                ></textarea>
            </div>

             <div class="enviar">
                <input 
                class="enviar-boton"
                type="submit"
                value="ENVIAR"
                >
             </div>

        </form>

    </div>

   

</section>

</section>

</main>

    <footer class="footer-index">
        <div class="footer-div">
            <img class="imagen-oliver" src="/img/principal/oliver martinez blanco.png" alt="Imagen Oliver">
            <a href=""></a>
            <p>2026 Immersive Lens. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="JS/contacto.js"></script>

</body>
</html>
